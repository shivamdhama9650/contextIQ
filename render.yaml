services:
  - type: web
    name: contextiq-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: bash render-build.sh
    startCommand: bash render-start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: EMBEDDING_MODEL_NAME
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_BATCH_SIZE
        value: "32"
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_data
      - key: CHROMA_COLLECTION_NAME
        value: company_knowledge
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
