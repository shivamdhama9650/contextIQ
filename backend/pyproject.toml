[project]
name = "enterprise-knowledge-assistant-api"
version = "0.1.0"
description = "FastAPI backend for the Enterprise Knowledge Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "PyJWT[crypto]>=2.10.0",
    "python-multipart>=0.0.20",
    "supabase>=2.10.0"
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "ruff>=0.7.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
